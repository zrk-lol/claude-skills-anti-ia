<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16070a"/><stop offset=".55" stop-color="#0b0b0e"/><stop offset="1" stop-color="#050506"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#ff1e1e" stop-opacity=".28"/><stop offset="1" stop-color="#ff1e1e" stop-opacity="0"/></radialGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#c40000"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></linearGradient>
<filter id="neon" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.5" result="a"/><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ff1e1e" stroke-opacity=".08"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern>
<clipPath id="frame"><rect width="1200" height="330" rx="18"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="330" fill="url(#bg)"/>
<rect width="1200" height="330" fill="url(#grid)"/>
<rect width="1200" height="330" fill="url(#glow)"/>
<text x="56" y="92" font-size="15" fill="#ff4d4d" font-weight="800" text-anchor="start" letter-spacing="6">CLAUDE SKILLS</text>
<g filter="url(#neon)"><text x="52" y="170" font-size="84" fill="none" font-weight="900" text-anchor="start" stroke="#ff4d4d" stroke-width="2.5">anti-IA</text></g>
<text x="56" y="216" font-size="24" fill="#f4f4f6" font-weight="600" text-anchor="start" >Pour que Claude fasse des sites</text>
<text x="56" y="248" font-size="24" fill="#f4f4f6" font-weight="600" text-anchor="start" >qui ne sentent pas l'IA.</text>
<text x="56" y="296" font-size="14" fill="#9a9aa4" font-weight="400" text-anchor="start" font-family="Consolas, 'SF Mono', Menlo, monospace">6 skills · textes · design · microcopy · typo · voix · audit</text>
<rect x="640" y="84" width="510" height="52" rx="10" fill="#121216" stroke="#26262c"/>
<text x="660" y="106" font-size="16" fill="#9a9aa4" font-weight="400" text-anchor="start" >Dans un monde en constante évolution,</text>
<line x1="658" y1="101" x2="941.2" y2="101" stroke="#ff1e1e" stroke-width="2.5"/>
<text x="660" y="127" font-size="15" fill="#f4f4f6" font-weight="600" text-anchor="start" >→ Je fais des sites pour les artisans de Lyon.</text><rect x="640" y="146" width="510" height="52" rx="10" fill="#121216" stroke="#26262c"/>
<text x="660" y="168" font-size="16" fill="#9a9aa4" font-weight="400" text-anchor="start" >Libérez votre potentiel digital</text>
<line x1="658" y1="163" x2="895.6" y2="163" stroke="#ff1e1e" stroke-width="2.5"/>
<text x="660" y="189" font-size="15" fill="#f4f4f6" font-weight="600" text-anchor="start" >→ Livré en 12 jours, commandes en ligne incluses.</text><rect x="640" y="208" width="510" height="52" rx="10" fill="#121216" stroke="#26262c"/>
<text x="660" y="230" font-size="16" fill="#9a9aa4" font-weight="400" text-anchor="start" >Des solutions innovantes et sur mesure</text>
<line x1="658" y1="225" x2="948.8" y2="225" stroke="#ff1e1e" stroke-width="2.5"/>
<text x="660" y="251" font-size="15" fill="#f4f4f6" font-weight="600" text-anchor="start" >→ Réponse sous 24 h, en semaine.</text>
<text x="1150" y="298" font-size="13" fill="#9a9aa4" font-weight="400" text-anchor="end" font-family="Consolas, 'SF Mono', Menlo, monospace">par Ȥrk · zrk.lol</text>
<rect width="1200" height="330" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="329" rx="18" fill="none" stroke="#ff1e1e" stroke-opacity=".35"/>
</svg>
